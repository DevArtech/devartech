  <text x="32" y="48" font-size="12" fill="#35e0ff" letter-spacing="2">AGENTS</text>
  <text x="32" y="86" font-size="26" font-weight="700" fill="#1f2328">Headquarters</text>
  <text x="252" y="86" font-size="15" fill="#59636e">a command center for agents</text>
  <text x="32" y="120" font-size="13.5" fill="#31363c">Runs coding agents across my machines, with a voice assistant, G.A.R.T.H.,</text><text x="32" y="142" font-size="13.5" fill="#31363c">on screen, phone and car: tasks, schedules, a local model, and tools.</text>
