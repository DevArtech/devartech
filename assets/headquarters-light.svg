  <g transform="translate(762 92)"><path d="M0 0 L-78 -38" stroke="#d0d7de" stroke-width="1.5"/><path d="M0 0 L78 -38" stroke="#d0d7de" stroke-width="1.5"/><path d="M0 0 L96 30" stroke="#d0d7de" stroke-width="1.5"/><path d="M0 0 L-96 30" stroke="#d0d7de" stroke-width="1.5"/><path d="M0 0 L0 66" stroke="#d0d7de" stroke-width="1.5"/><circle cx="-78" cy="-38" r="5" fill="#35e0ff"/><text x="-88" y="-34" font-size="11" text-anchor="end" fill="#59636e">PC</text><circle cx="78" cy="-38" r="5" fill="#35e0ff"/><text x="88" y="-34" font-size="11" text-anchor="start" fill="#59636e">Spark</text><circle cx="96" cy="30" r="5" fill="#35e0ff"/><text x="106" y="34" font-size="11" text-anchor="start" fill="#59636e">Mac</text><circle cx="-96" cy="30" r="5" fill="#35e0ff"/><text x="-106" y="34" font-size="11" text-anchor="end" fill="#59636e">phone</text><circle cx="0" cy="66" r="5" fill="#35e0ff"/><text x="10" y="70" font-size="11" text-anchor="start" fill="#59636e">car</text>
