  <text x="32" y="86" font-size="26" font-weight="700" fill="#e6edf3">Headquarters</text>
  <text x="252" y="86" font-size="15" fill="#7d8590">a command center for agents</text>
  <text x="32" y="120" font-size="13.5" fill="#c9d1d9">Runs coding agents across all my machines, with G.A.R.T.H., a voice</text><text x="32" y="142" font-size="13.5" fill="#c9d1d9">assistant on screen, phone and car: tasks, schedules, local model.</text>
