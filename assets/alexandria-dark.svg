  <text x="218" y="86" font-size="15" fill="#7d8590">memory for LLM agents</text>
  <text x="32" y="120" font-size="13.5" fill="#c9d1d9">A local-first, CLI-first memory substrate: plain-text Markdown engrams,</text><text x="32" y="142" font-size="13.5" fill="#c9d1d9">a rebuildable SQLite index, typed tiers, and honest “I don't know” recall.</text>
